<!doctype html>
<html lang="en" data-theme="system">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>API Console</title>

  <!-- Apply the saved theme before anything is drawn, so there's no flash of the wrong theme. -->
  <script>
    (() => {
      var t = "system";
      try { t = localStorage.getItem("apiconsole.theme") || "system"; } catch {}
      if (["system", "light", "dark"].indexOf(t) < 0) t = "system";
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
</head>
<body class="bg-canvas font-sans text-[13px] text-fg">
  <div id="root"></div>
</body>
</html>
