name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel an older run of the same PR/branch when a newer commit arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# This workflow only reads the code.
permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (Biome)
        run: npx biome ci --reporter=github .

      - name: Build
        run: npm run build
